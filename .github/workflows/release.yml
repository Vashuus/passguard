name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Empaquetar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: passguard-${{ github.ref_name }}-Linux_x86_64.tar.gz
          - os: windows-latest
            asset: passguard-${{ github.ref_name }}-Windows_x86_64.zip
          - os: macos-latest
            asset: passguard-${{ github.ref_name }}-macOS.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Dependencias GUI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libgtk-3-dev

      - name: Build
        run: go build -ldflags "-s -w" -o passguard ./cmd/passguard

      - name: Empaquetar (tar.gz, Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/passguard
          cp passguard README.md LICENSE dist/passguard/
          tar -C dist -czf "${{ matrix.asset }}" passguard

      - name: Empaquetar (zip, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/passguard | Out-Null
          go build -ldflags "-s -w" -o dist/passguard/passguard.exe ./cmd/passguard
          if (-not (Test-Path dist/passguard/passguard.exe)) { throw "passguard.exe no se generó" }
          Copy-Item README.md,LICENSE dist/passguard/
          Compress-Archive -Path dist/passguard -DestinationPath "${{ matrix.asset }}"

      - name: Empaquetar (dmg, macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/passguard
          cp passguard README.md LICENSE dist/passguard/
          hdiutil create -volname passguard -srcfolder dist/passguard -ov "${{ matrix.asset }}"

      - name: Subir a Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            *.dmg
          generate_release_notes: true