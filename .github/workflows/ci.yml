name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Dependencias GUI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libgtk-3-dev

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Test (race en core)
        run: |
          go test ./...
          go test -race ./internal/strength/ ./internal/generator/

      - name: Build binario
        run: go build -ldflags "-s -w" -o passguard ./cmd/passguard

      - name: Smoke test CLI
        if: runner.os == 'Linux'
        run: |
          ./passguard check "123456"
          ./passguard gen -l 20